name: Build and Push Seeder Image

# Publishes the sdk-seeder container to ECR for the accelerated alpha run.
#
# Only immutable sha-<short-sha> tags are published. `latest` is deliberately
# absent: an accelerated run records the exact image it used, and a moving tag
# would make that record meaningless.
on:
  push:
    branches: [main]
    paths:
      - "packages/sdk-seeder/**"
      - "packages/sdk-*/src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".dockerignore"
      - ".github/workflows/build-push-seeder.yml"
  pull_request:
    paths:
      - "packages/sdk-seeder/**"
      - ".dockerignore"
      - ".github/workflows/build-push-seeder.yml"
  workflow_dispatch:

concurrency:
  group: seeder-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPO_NAME: durion/sdk-seeder
  IMAGE_NAME: sdk-seeder

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build the image and prove the container actually starts.
  # Runs on pull requests too, where nothing is published.
  # ─────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Build and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6
        with:
          context: .
          file: packages/sdk-seeder/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as a non-root user
        run: |
          set -euo pipefail
          CONFIGURED_USER="$(docker image inspect --format '{{.Config.User}}' "${IMAGE_NAME}:ci")"
          echo "Configured user: ${CONFIGURED_USER:-<empty>}"
          if [[ -z "${CONFIGURED_USER}" || "${CONFIGURED_USER}" == "root" || "${CONFIGURED_USER}" == "0" ]]; then
            echo "::error::The seeder image must not run as root"
            exit 1
          fi
          RUNTIME_UID="$(docker run --rm --entrypoint id "${IMAGE_NAME}:ci" -u)"
          echo "Runtime uid: ${RUNTIME_UID}"
          if [[ "${RUNTIME_UID}" == "0" ]]; then
            echo "::error::The seeder image resolved to uid 0 at runtime"
            exit 1
          fi

      - name: Entry point starts the seeder and rejects missing configuration
        run: |
          set -euo pipefail
          # No SEEDER_USERNAME/SEEDER_PASSWORD: the run must fail immediately with
          # the configuration error rather than hanging or starting work. This is
          # what proves the configured command actually reaches the seeder.
          set +e
          OUTPUT="$(docker run --rm "${IMAGE_NAME}:ci" 2>&1)"
          EXIT_CODE=$?
          set -e

          echo "${OUTPUT}"

          if [[ "${EXIT_CODE}" -eq 0 ]]; then
            echo "::error::The seeder exited 0 with no credentials configured"
            exit 1
          fi
          if ! grep -q "Required environment variable SEEDER_USERNAME is not set" <<<"${OUTPUT}"; then
            echo "::error::Expected the missing-configuration message from SeederConfig"
            exit 1
          fi

      - name: Image carries no baked configuration
        run: |
          set -euo pipefail
          # Credentials, URLs, clock anchors and environment identifiers are all
          # execution-time inputs. Anything baked in would travel with the image
          # to every environment that pulls it.
          BAKED_ENV="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${IMAGE_NAME}:ci")"
          echo "${BAKED_ENV}"
          if grep -Eiq '^(SEEDER_(USERNAME|PASSWORD|BASE_URL|SECURITY_SERVICE_URL)|POS_TIME_ACCELERATED_|AWS_)' <<<"${BAKED_ENV}"; then
            echo "::error::The image bakes in run or environment configuration"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Publish the immutable image. Never runs for pull requests.
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to ECR
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set image metadata
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="sha-${SHORT_SHA}"
          FULL_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPO_NAME}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6
        with:
          context: .
          file: packages/sdk-seeder/Dockerfile
          push: true
          # Immutable tag only. Do not add `latest`: the alpha run takes the
          # seeder tag as an explicit input and records it in its run metadata.
          tags: ${{ steps.meta.outputs.full_image }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the image in the job summary
        run: |
          {
            echo "## Seeder image published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${ECR_REPO_NAME}\` |"
            echo "| Tag | \`${{ steps.meta.outputs.image_tag }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo
            echo "Pass this tag to \`run-alpha-seeder.yml\` as \`seeder_tag\`:"
            echo
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.image_tag }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
