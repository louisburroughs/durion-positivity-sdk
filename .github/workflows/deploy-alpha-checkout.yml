name: Build, Smoke Test and Deploy to Alpha

# Keeps the alpha host's checkout current, because that checkout *is* the
# deployment.
#
# There is no SDK container. The accelerated run is a git checkout on the alpha
# EC2 instance, built and run natively — `~/durion-positivity-sdk`, `npm run
# test:accelerated`, `.env.itest` beside it. The backend's Deploy Alpha
# (Accelerated Clock) workflow starts that run from this checkout once its stack
# verifies, so what this workflow keeps current is what that dispatch runs. The workflow this replaced built a
# seeder image and pushed it to `durion/sdk-seeder`, an ECR repository that does
# not exist, for a container nothing pulls; it failed on all 24 of its pushes to
# main and published nothing in its life.
#
# So the deployment step is a pull and a build on the host, over SSM. Nothing is
# packaged, because nothing consumes a package.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One deploy at a time per ref: two overlapping `git pull`s on one checkout is
  # how a host ends up half-built.
  group: alpha-checkout-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Where the alpha host keeps its checkout. The run reads `.env.itest` from
  # beside it, which is the host's and never this repository's.
  CHECKOUT_DIR: /home/ec2-user/durion-positivity-sdk

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: the seeder still starts and still refuses to run unconfigured.
  #
  # Deliberately narrow. Lint, typecheck, build and the unit tests are
  # pr-checks.yml's job and are not repeated here; what this adds is the one
  # guarantee the deleted container smoke test was actually protecting — that
  # the configured entry point reaches SeederConfig, and that a seeder with no
  # credentials fails immediately instead of starting work against whatever it
  # can reach.
  # ─────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Build and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build every package in dependency order
        run: npm run build

      - name: The seeder rejects missing configuration rather than starting
        env:
          # Explicitly emptied: a runner that happened to carry either of these
          # would turn this assertion into a live seeding attempt.
          SEEDER_USERNAME: ""
          SEEDER_PASSWORD: ""
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(npm run seed -w packages/sdk-seeder 2>&1)"
          EXIT_CODE=$?
          set -e

          echo "${OUTPUT}"

          if [[ "${EXIT_CODE}" -eq 0 ]]; then
            echo "::error::The seeder exited 0 with no credentials configured"
            exit 1
          fi
          if ! grep -q "Required environment variable SEEDER_USERNAME is not set" <<<"${OUTPUT}"; then
            echo "::error::Expected the missing-configuration message from SeederConfig"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: bring the alpha checkout to this commit. Never runs for pull
  # requests — a branch that is not on main is not what alpha should be running.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Alpha
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the alpha instance
        id: host
        env:
          CONFIGURED_ID: ${{ vars.ALPHA_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # An explicit id wins. Without one, fall back to the single online
          # managed instance — true of this account today, and an ambiguous
          # answer is refused rather than guessed at, because the wrong host
          # would be updated silently.
          if [[ -n "${CONFIGURED_ID}" ]]; then
            INSTANCE_ID="${CONFIGURED_ID}"
          else
            # JSON, not --output text: text renders an empty list as the literal
            # `None`, which counts as one instance and sends the command to a
            # host called None — the opposite of the refusal below.
            mapfile -t ONLINE < <(aws ssm describe-instance-information \
              --filters "Key=PingStatus,Values=Online" \
              --query 'InstanceInformationList[].InstanceId' --output json | jq -r '.[]')
            if [[ "${#ONLINE[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one online SSM instance, found ${#ONLINE[@]}: ${ONLINE[*]:-none}. Set the ALPHA_INSTANCE_ID repository variable."
              exit 1
            fi
            INSTANCE_ID="${ONLINE[0]}"
          fi
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "Deploying to ${INSTANCE_ID}"

      - name: Pull and build the checkout
        id: deploy
        env:
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
        run: |
          set -euo pipefail

          # Three things this has to get right, each of which bit the first
          # version of it:
          #
          #   - It deploys *this* commit. `git pull` would fast-forward to
          #     whatever origin/main holds when the command finally runs, so a
          #     queued run could report one sha in its summary and build a newer
          #     one. Merging the triggering sha explicitly pins it, and still
          #     leaves the host on main for whoever pulls by hand next.
          #   - `--ff-only` refuses a diverged checkout. A host someone has been
          #     working on by hand is not this workflow's to merge over.
          #   - It runs as ec2-user. AWS-RunShellScript runs as root, and a root
          #     `npm ci` leaves a root-owned node_modules in a checkout whose
          #     whole purpose is to be run by hand from that account. `-l` because
          #     node is on ec2-user's profile PATH, not root's.
          #
          # The heredoc is unquoted so the sha and the path are fixed here rather
          # than resolved on the host; there is deliberately no `$` left inside.
          read -r -d '' SCRIPT <<REMOTE || true
          set -euo pipefail
          sudo -u ec2-user -H bash -lc '
            set -euo pipefail
            cd ${CHECKOUT_DIR}
            git fetch origin main
            git checkout main
            git merge --ff-only ${GITHUB_SHA}
            npm ci
            npm run build
            git rev-parse HEAD
          '
          REMOTE

          # --parameters as JSON, not shorthand: the script is multi-line and
          # carries quotes, and jq is what makes that survive the trip intact.
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" \
            --parameters "$(jq -n --arg s "${SCRIPT}" '{commands: [$s]}')" \
            --query 'Command.CommandId' --output text)"
          echo "command: ${COMMAND_ID}"

          # Polled here rather than with `aws ssm wait command-executed`, which
          # is fixed at 20 attempts five seconds apart: it gives up after about
          # 100 seconds and reports InProgress as a failure, while the host
          # carries on building. `npm ci` and an ordered workspace build take
          # longer than that on this instance — the first real deploy died
          # exactly there, on a command that was still running fine.
          #
          # 100 x 10s = ~17 minutes, inside the job's 20.
          STATUS="Pending"
          # Consecutive unexpected errors, reset by any successful poll. One
          # throttle should not abort a deploy that is running fine; three in a
          # row is a problem worth failing on rather than waiting out.
          GLITCHES=0
          for _ in $(seq 1 100); do
            set +e
            POLLED="$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query 'Status' --output text 2>&1)"
            RC=$?
            set -e

            if [[ "${RC}" -eq 0 ]]; then
              STATUS="${POLLED}"
              GLITCHES=0
            elif grep -q 'InvocationDoesNotExist' <<<"${POLLED}"; then
              # The one expected race: a command that has been accepted but has
              # not reached the instance yet.
              STATUS="Pending"
              GLITCHES=0
            else
              # Anything else — throttling, expired credentials, the network —
              # is not the command's status and must not be read as one. Waiting
              # it out would report a seventeen-minute timeout for a failure that
              # happened in the first ten seconds.
              GLITCHES=$((GLITCHES + 1))
              echo "polling the deploy command failed (${GLITCHES}/3): ${POLLED}"
              if [[ "${GLITCHES}" -ge 3 ]]; then
                echo "::error::Could not read the status of ${COMMAND_ID}: ${POLLED}"
                exit 1
              fi
            fi

            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          STDOUT="$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query 'StandardOutputContent' --output text)"
          STDERR="$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query 'StandardErrorContent' --output text)"

          echo "--- host stdout ---"
          echo "${STDOUT}"
          if [[ -n "${STDERR}" ]]; then
            echo "--- host stderr ---"
            echo "${STDERR}"
          fi

          # The host prints the revision it ended on, and it has to be the one
          # this run was triggered for. Reporting a sha the host is not actually
          # at is the failure this check exists to make impossible.
          DEPLOYED="$(tail -n 1 <<<"${STDOUT}" | tr -d '[:space:]')"
          if [[ "${STATUS}" == "Success" && "${DEPLOYED}" != "${GITHUB_SHA}" ]]; then
            echo "::error::The host ended on ${DEPLOYED:-<nothing>}, not ${GITHUB_SHA}"
            exit 1
          fi

          {
            echo "## Alpha checkout"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Instance | \`${INSTANCE_ID}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Status | \`${STATUS}\` |"
            echo "| Command | \`${COMMAND_ID}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${STATUS}" != "Success" ]]; then
            echo "::error::The deploy command finished ${STATUS} on ${INSTANCE_ID}"
            exit 1
          fi

      - name: Say what the host is now running
        if: always()
        run: |
          echo "The accelerated run is started from this checkout by the backend's"
          echo "'Deploy Alpha (Accelerated Clock)' workflow (its sdk_run input), the moment"
          echo "the accelerated stack verifies. It logs to ${CHECKOUT_DIR}/accelerated-latest.log."
          echo "By hand, on the host (sdk_run=none):"
          echo "  cd ${CHECKOUT_DIR} && ITEST_BASE_URL=http://localhost:8080 ITEST_SECURITY_SERVICE_URL=http://localhost:8086 npm run test:accelerated"
